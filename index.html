<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
height:100vh;
overflow:hidden;
background:#050816;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

/* Animated Background */

body::before{
content:'';
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,#00d4ff30 0%,transparent 70%);
top:-250px;
right:-200px;
animation:float1 8s ease-in-out infinite;
}

body::after{
content:'';
position:absolute;
width:600px;
height:600px;
background:radial-gradient(circle,#7b61ff25 0%,transparent 70%);
bottom:-250px;
left:-200px;
animation:float2 10s ease-in-out infinite;
}

@keyframes float1{
50%{transform:translateY(40px);}
}

@keyframes float2{
50%{transform:translateY(-40px);}
}

/* Floating Particles */

.particles span{
position:absolute;
width:4px;
height:4px;
background:#00d4ff;
border-radius:50%;
opacity:.5;
animation:particle 12s linear infinite;
}

@keyframes particle{
from{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
to{
transform:translateY(-100px);
opacity:0;
}
}

.container{
width:92%;
max-width:900px;
position:relative;
z-index:2;
}

.card{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:28px;
padding:30px;
text-align:center;
box-shadow:
0 0 50px rgba(0,212,255,.15),
0 0 100px rgba(123,97,255,.12);
}

.logo-wrap{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
padding:4px;
background:linear-gradient(135deg,#00d4ff,#7b61ff);
box-shadow:0 0 30px rgba(0,212,255,.5);
animation:pulse 3s infinite;
}

.logo-wrap img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
background:#111;
}

@keyframes pulse{
50%{
transform:scale(1.05);
box-shadow:0 0 45px rgba(0,212,255,.8);
}
}

.brand{
font-family:'Orbitron',sans-serif;
font-size:52px;
font-weight:900;
margin-top:18px;
background:linear-gradient(90deg,#ffffff,#00d4ff,#7b61ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
margin-top:10px;
font-size:15px;
color:#cfcfcf;
}

.stats{
display:flex;
justify-content:center;
gap:12px;
margin:25px 0;
flex-wrap:wrap;
}

.stat{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:12px 18px;
border-radius:14px;
min-width:120px;
}

.stat h3{
font-size:20px;
color:#00d4ff;
margin-bottom:3px;
}

.stat p{
font-size:12px;
color:#ccc;
}

.features{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:25px;
}

.feature{
padding:10px 15px;
background:rgba(123,97,255,.12);
border:1px solid rgba(123,97,255,.25);
border-radius:30px;
font-size:13px;
}

.cta{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
padding:18px 42px;
font-weight:700;
font-size:17px;
border-radius:60px;
background:linear-gradient(135deg,#00d4ff,#7b61ff);
color:#fff;
box-shadow:
0 0 25px rgba(0,212,255,.5),
0 0 60px rgba(123,97,255,.4);
transition:.35s;
}

.cta:hover{
transform:translateY(-4px) scale(1.04);
box-shadow:
0 0 40px rgba(0,212,255,.9),
0 0 80px rgba(123,97,255,.8);
}

.bottom{
margin-top:18px;
font-size:11px;
opacity:.6;
}

.live-dot{
display:inline-block;
width:8px;
height:8px;
background:#00ff88;
border-radius:50%;
box-shadow:0 0 12px #00ff88;
animation:blink 1s infinite;
margin-right:6px;
}

@keyframes blink{
50%{
opacity:.3;
}
}

@media(max-width:768px){

.brand{
font-size:38px;
}

.card{
padding:25px 18px;
}

.stat{
min-width:100px;
}

}
